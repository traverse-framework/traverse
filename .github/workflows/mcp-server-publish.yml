name: Publish traverse-mcp binaries

# Spec 119 FR-006 / #1653: Mode A ships as a versioned standalone binary with
# checksums and build provenance. Artifact release tag is traverse-mcp-vX.Y.Z
# (never Latest); product tag vX.Y.Z remains crates.io / product notes.
# Spec 119 0.2.0 / Decision 121 / #1753: four targets (Linux x64 + arm64,
# macOS arm64, Windows x64 as .zip), each smoke-run before upload.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Product tag to package, e.g. v0.15.0. Dispatch against the ref that
          has this workflow (usually main), not the tag itself.
        required: true
      rebuild:
        description: >-
          Optional rebuild number N for traverse-mcp-v<version>-N when the
          immutable release must be replaced after a packaging fix.
        required: false
        default: ""
      dry_run:
        description: >-
          Build, smoke-run, and checksum every target, but skip attestation
          and the release. SHA256SUMS is uploaded as a workflow artifact.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: traverse-mcp-x86_64-unknown-linux-gnu.tar.gz
            bin: traverse-mcp
            python: python3
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: traverse-mcp-aarch64-unknown-linux-gnu.tar.gz
            bin: traverse-mcp
            python: python3
          - os: macos-14
            target: aarch64-apple-darwin
            archive: traverse-mcp-aarch64-apple-darwin.tar.gz
            bin: traverse-mcp
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: traverse-mcp-x86_64-pc-windows-msvc.zip
            bin: traverse-mcp.exe
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Resolve versions
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              found = 1
              exit
            }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          release_tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          if [[ "${workspace_version}" != "${tag_version}" ]]; then
            echo "Cargo.toml workspace version ${workspace_version} does not match tag ${release_tag}." >&2
            exit 1
          fi
          rebuild="${{ github.event.inputs.rebuild }}"
          if [[ -z "${rebuild}" ]]; then
            mcp_tag="traverse-mcp-v${tag_version}"
          elif [[ "${rebuild}" =~ ^[1-9][0-9]*$ ]]; then
            mcp_tag="traverse-mcp-v${tag_version}-${rebuild}"
          else
            echo "rebuild must be a positive integer, got '${rebuild}'." >&2
            exit 1
          fi
          echo "TAG_VERSION=${tag_version}" >> "$GITHUB_ENV"
          echo "MCP_RELEASE_TAG=${mcp_tag}" >> "$GITHUB_ENV"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --locked -p traverse-mcp --release --target "${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          # Smoke run: the built binary must start and report this tag and commit.
          "$bin" --version | tee version.txt
          grep -F "traverse-mcp ${TAG_VERSION}" version.txt
          grep -F "${GIT_SHA}" version.txt
          "${{ matrix.python }}" - "$bin" "${{ matrix.archive }}" <<'PY'
          import hashlib, os, pathlib, sys, tarfile, zipfile
          binary = pathlib.Path(sys.argv[1])
          path = pathlib.Path(sys.argv[2])
          if path.name.endswith(".zip"):
              with zipfile.ZipFile(path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, binary.name)
          else:
              with tarfile.open(path, "w:gz") as archive:
                  info = archive.gettarinfo(str(binary), arcname=binary.name)
                  info.mode = 0o755
                  with binary.open("rb") as handle:
                      archive.addfile(info, handle)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          line = f"{digest}  {path.name}\n"
          path.with_name(path.name + ".sha256").write_bytes(line.encode("utf-8"))
          print(line, end="")
          PY

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: mcp-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              found = 1
              exit
            }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          release_tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          if [[ "${workspace_version}" != "${tag_version}" ]]; then
            echo "Cargo.toml workspace version ${workspace_version} does not match tag ${release_tag}." >&2
            exit 1
          fi
          rebuild="${{ github.event.inputs.rebuild }}"
          if [[ -z "${rebuild}" ]]; then
            mcp_tag="traverse-mcp-v${tag_version}"
          elif [[ "${rebuild}" =~ ^[1-9][0-9]*$ ]]; then
            mcp_tag="traverse-mcp-v${tag_version}-${rebuild}"
          else
            echo "rebuild must be a positive integer, got '${rebuild}'." >&2
            exit 1
          fi
          echo "TAG_VERSION=${tag_version}" >> "$GITHUB_ENV"
          echo "MCP_RELEASE_TAG=${mcp_tag}" >> "$GITHUB_ENV"

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mcp-*
          merge-multiple: true

      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          ls -la
          {
            echo "### traverse-mcp asset SHA-256"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SHA256SUMS (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mcp-SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest build provenance
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/traverse-mcp-x86_64-unknown-linux-gnu.tar.gz
            dist/traverse-mcp-aarch64-unknown-linux-gnu.tar.gz
            dist/traverse-mcp-aarch64-apple-darwin.tar.gz
            dist/traverse-mcp-x86_64-pc-windows-msvc.zip

      - name: Create immutable artifact release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${MCP_RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${MCP_RELEASE_TAG} already exists (immutable). Use rebuild N for traverse-mcp-v${TAG_VERSION}-N." >&2
            exit 1
          fi
          notes="$(cat <<NOTES
          Artifact-only release for the Mode A \`traverse-mcp\` stdio binary (Spec 119 FR-006).

          This is **not** the Traverse product release: that is **Traverse v${TAG_VERSION}** on tag \`v${TAG_VERSION}\`. The immutable-releases policy for this repository requires a dedicated \`traverse-mcp-v*\` tag so assets ship in one create call and are never marked Latest.

          Targets: \`x86_64-unknown-linux-gnu\`, \`aarch64-unknown-linux-gnu\`, \`aarch64-apple-darwin\` (\`.tar.gz\`), and \`x86_64-pc-windows-msvc\` (\`.zip\`).

          Verify (on Windows, download the \`.zip\` and run \`traverse-mcp.exe --version\`):

          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/download/${MCP_RELEASE_TAG}/traverse-mcp-<target>.tar.gz
          curl -LO https://github.com/${{ github.repository }}/releases/download/${MCP_RELEASE_TAG}/SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify traverse-mcp-<target>.tar.gz --repo ${{ github.repository }}
          tar -xzf traverse-mcp-<target>.tar.gz
          ./traverse-mcp --version
          \`\`\`

          SHA-256 of each asset:

          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`

          Built from commit \`${GITHUB_SHA}\` for workspace **v${TAG_VERSION}**.
          NOTES
          )"
          gh release create "${MCP_RELEASE_TAG}" \
            dist/traverse-mcp-x86_64-unknown-linux-gnu.tar.gz \
            dist/traverse-mcp-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/traverse-mcp-aarch64-unknown-linux-gnu.tar.gz \
            dist/traverse-mcp-aarch64-unknown-linux-gnu.tar.gz.sha256 \
            dist/traverse-mcp-aarch64-apple-darwin.tar.gz \
            dist/traverse-mcp-aarch64-apple-darwin.tar.gz.sha256 \
            dist/traverse-mcp-x86_64-pc-windows-msvc.zip \
            dist/traverse-mcp-x86_64-pc-windows-msvc.zip.sha256 \
            dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "traverse-mcp binaries (workspace v${TAG_VERSION})" \
            --notes "${notes}" \
            --latest=false
