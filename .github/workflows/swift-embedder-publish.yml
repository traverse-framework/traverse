name: Publish Swift embedder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to (re)publish, e.g. v0.13.0. Only for re-running a
          publish after a workflow fix; dispatch against the ref that has the
          fix (e.g. main), not the tag itself, since a tag's own copy of this
          file is frozen at whatever it looked like when the tag was pushed.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Resolve release tag
        shell: bash
        run: echo "RELEASE_TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Verify release tag matches Cargo workspace version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              found = 1
              exit
            }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${workspace_version}" != "${tag_version}" ]]; then
            echo "Cargo.toml workspace version ${workspace_version} does not match tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          echo "TAG_VERSION=${tag_version}" >> "$GITHUB_ENV"
          echo "SWIFT_RELEASE_TAG=swift-host-v${tag_version}" >> "$GITHUB_ENV"

      - name: Build TraverseSwiftHost.xcframework
        run: bash scripts/build_swift_host_xcframework.sh

      - name: Zip the xcframework
        working-directory: target/apple
        run: zip -r -y TraverseSwiftHost.xcframework.zip TraverseSwiftHost.xcframework

      - name: Compute the Swift package checksum
        id: checksum
        run: |
          echo "value=$(swift package compute-checksum target/apple/TraverseSwiftHost.xcframework.zip)" >> "$GITHUB_OUTPUT"

      # This repo has GitHub's immutable-releases policy enabled: once a
      # release is published, no asset can ever be added or replaced on it
      # afterward (a separate `gh release upload` fails with "Cannot upload
      # assets to an immutable release"), and the tag name itself can never
      # be reused for a release again, even after deleting that release.
      # Publishing the xcframework under the shared v<version> tag (used by
      # crates.io/Maven/NuGet, which don't need a GitHub Release object at
      # all) would permanently burn that tag for a release the moment any
      # one CI attempt failed after creating it. Use a dedicated
      # swift-host-v<version> tag instead, exactly as commit 53651d0 already
      # established for this same reason. The asset is attached in the same
      # `gh release create` call that publishes the release, since that's
      # the only point at which an immutable release can receive one.
      - name: Create the release with the xcframework attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${SWIFT_RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${SWIFT_RELEASE_TAG} already exists and this repo's releases are immutable once published: its assets can't be added or replaced now. If it's missing the xcframework, delete the release and use a new swift-host-v<version> tag." >&2
            exit 1
          fi
          gh release create "${SWIFT_RELEASE_TAG}" target/apple/TraverseSwiftHost.xcframework.zip \
            --repo "${{ github.repository }}" \
            --title "TraverseSwiftHost ${SWIFT_RELEASE_TAG}" --generate-notes

      # Package.swift is a tracked, consumer-facing file: proposed as a PR
      # rather than pushed straight to main, since updating the binary
      # target's URL/checksum is a real decision (this repo's only prior
      # instance of this exact change, commit 53651d0, was made by hand).
      - name: Update Package.swift's binary target
        run: |
          python3 - "${SWIFT_RELEASE_TAG}" "${{ steps.checksum.outputs.value }}" "${{ github.repository }}" <<'PY'
          import re
          import sys

          release_tag, checksum, repo = sys.argv[1:4]
          path = "packages/swift/TraverseEmbedder/Package.swift"
          with open(path, encoding="utf-8") as handle:
              text = handle.read()

          url = f"https://github.com/{repo}/releases/download/{release_tag}/TraverseSwiftHost.xcframework.zip"
          text = re.sub(r'url: "[^"]*TraverseSwiftHost\.xcframework\.zip"', f'url: "{url}"', text, count=1)
          text = re.sub(r'checksum: "[0-9a-f]+"', f'checksum: "{checksum}"', text, count=1)

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

      - name: Open a PR updating Package.swift
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/swift-host-${{ env.TAG_VERSION }}
          commit-message: "chore(swift): point Package.swift at the ${{ env.SWIFT_RELEASE_TAG }} xcframework"
          title: "chore(swift): point Package.swift at the ${{ env.SWIFT_RELEASE_TAG }} xcframework"
          body: |
            Rebuilt `TraverseSwiftHost.xcframework` for Traverse `v${{ env.TAG_VERSION }}` and published
            it under the dedicated `${{ env.SWIFT_RELEASE_TAG }}` release tag (this repo's releases are
            immutable, so the xcframework can't share the `v${{ env.TAG_VERSION }}` tag used by
            crates.io/Maven/NuGet). Updates `Package.swift`'s binary target URL and checksum to match.

            ## Governing Spec

            - `136-native-embedder-publication`

            ## Project Item

            Refs #1370

            ## Validation

            - `swift package compute-checksum` against the uploaded release asset (this PR's checksum).
