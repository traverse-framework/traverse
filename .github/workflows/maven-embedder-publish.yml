name: Publish Kotlin embedder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to (re)publish, e.g. v0.13.0. Only for re-running a
          publish after a workflow fix; dispatch against the ref that has the
          fix (e.g. main), not the tag itself, since a tag's own copy of this
          file is frozen at whatever it looked like when the tag was pushed.
        required: true

permissions:
  contents: read

jobs:
  publish:
    # GitHub's macos-latest image ships a pre-installed Android SDK and
    # Gradle, matching native-artifact-certification's own setup (no
    # dedicated Android SDK / Gradle install step needed there either).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/kotlin/TraverseEmbedder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Decision 108: Kotlin unit tests build the host-JVM JNI model host, and
      # the AAR ships the arm64-v8a / x86_64 builds.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Resolve release tag
        working-directory: .
        shell: bash
        run: echo "RELEASE_TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Verify release tag matches Cargo workspace version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              found = 1
              exit
            }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${workspace_version}" != "${tag_version}" ]]; then
            echo "Cargo.toml workspace version ${workspace_version} does not match tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          echo "TAG_VERSION=${tag_version}" >> "$GITHUB_ENV"

      - name: Test
        run: gradle --no-daemon testDebugUnitTest

      - name: Cross-build traverse-android-host into the AAR (Decision 108)
        working-directory: .
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          bash scripts/build_android_host_ndk.sh packages/kotlin/TraverseEmbedder/traverse-embedder/build/jniLibs

      - name: Verify the release AAR carries both ABIs
        run: |
          gradle --no-daemon -Pversion=${TAG_VERSION} :traverse-embedder:assembleRelease
          bash ../../../scripts/ci/android_aar_check.sh traverse-embedder/build/outputs/aar/traverse-embedder-release.aar

      # Sonatype Central Portal credentials + an in-memory GPG signing key,
      # already provisioned as repo secrets. build.gradle.kts sets
      # automaticRelease = true, so this validates, uploads, and publishes in
      # one step; a version already released is rejected by Central itself,
      # so a rerun on an unchanged tag is a safe no-op.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: gradle --no-daemon -Pversion=${TAG_VERSION} publishToMavenCentral
