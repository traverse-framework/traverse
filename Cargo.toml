[workspace]
members = [
  "crates/traverse-cli",
  "crates/traverse-contracts",
  "crates/traverse-embedder",
  "crates/traverse-expedition-wasm",
  "crates/traverse-mcp",
  "crates/traverse-registry-sync",
  "crates/traverse-model-trainer",
  "crates/traverse-native-bridge",
  "crates/traverse-runtime",
  "crates/traverse-runtime-wasm",
  "crates/traverse-swift-host",
  "crates/traverse-model-host-frame",
  "crates/traverse-android-host",
  "crates/traverse-dotnet-host",
  "crates/traverse-coreml-adapter",
  "crates/traverse-nested-wasm-spike",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/traverse-framework/traverse"
rust-version = "1.95"
version = "0.15.0"

[workspace.dependencies]
traverse-contracts = { path = "crates/traverse-contracts", version = "0.15.0" }
traverse-registry = { version = "=0.28.0" }
traverse-runtime = { path = "crates/traverse-runtime", version = "0.15.0" }
traverse-embedder = { path = "crates/traverse-embedder", version = "0.15.0" }
traverse-mcp = { path = "crates/traverse-mcp", version = "0.15.0" }
traverse-registry-sync = { path = "crates/traverse-registry-sync", version = "0.15.0" }

# The published registry crate pins the current contracts release.  During
# Traverse development, resolve that transitive dependency to this workspace's
# matching contracts source so all consumers share one Rust type identity.
[patch.crates-io]
traverse-contracts = { path = "crates/traverse-contracts" }

[workspace.lints.rust]
# C-ABI exports are permitted only in the audited Apple feasibility boundary.
# `scripts/ci/scoped_unsafe_boundary_check.sh` verifies that no other crate
# can opt out of this workspace policy.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[workspace.metadata.cyclonedx]
all_features = true
format = "json"
output = "traverse-sbom.cdx.json"

# #1681 (Decision 115). An unoptimized wasmi interprets model guests orders
# of magnitude slower (YAMNet: ~3.5 s release vs. >10 min at opt-level 0), so
# a debug host such as `cargo run -p traverse-cli-rs` misses a package's
# `max_execution_ms` that a release host meets easily. Dev and test builds
# therefore always optimize the interpreter.
#
# `debug-assertions = false` is required, not cosmetic. At opt-level 2+ wasmi
# switches to tail-call dispatch, and debug assertions keep LLVM from turning
# those calls into jumps, so a long guest overflows the native stack and
# aborts the process (not a fail-closed error). The
# `wasmi_long_guest_runs_without_native_stack_growth` test pins this.
# Semantics, fuel accounting and every ceiling are unchanged. Only this
# workspace's builds are affected; apps that depend on traverse-runtime add
# the same override (docs/model-packaging-guide.md).
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
[profile.dev.package.wasmi_collections]
opt-level = 3
debug-assertions = false
