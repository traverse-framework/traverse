# Decision 106: the runner ships as a simd128 build (1.84 s vs 3.23 s per
# BirdNET clip on wasmi).
[target.wasm32-unknown-unknown]
# getrandom 0.4 (tract's Random* ops) uses its import-free `unsupported`
# backend: randomness requests fail instead of importing host entropy.
rustflags = ["-C", "target-feature=+simd128", "-C", "link-arg=--export=__stack_pointer", "--cfg", "getrandom_backend=\"unsupported\""]
