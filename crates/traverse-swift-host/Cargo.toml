[package]
name = "traverse-swift-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Apple static-library feasibility host for the Traverse runtime bridge."

[lib]
crate-type = ["staticlib"]

[dependencies]
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "auto-dispatch", "simd"] }
wat = "1"
sha2 = "0.11"
serde_json = "1.0.145"
# Spec 138 exact-ref model host (Decision 104): wasmi interpreter only, since
# iOS forbids the wasmtime JIT.
traverse-runtime = { path = "../traverse-runtime", version = "0.14.0", default-features = false, features = ["wasmi-executor"] }

[lints]
workspace = true
