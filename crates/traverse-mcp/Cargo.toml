[package]
name = "traverse-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server for the Traverse capability runtime."

[[bin]]
name = "traverse-mcp"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "3.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
traverse-contracts = { workspace = true }
traverse-registry = { workspace = true }
traverse-registry-sync = { workspace = true }
traverse-embedder = { workspace = true }
traverse-runtime = { workspace = true }

[dev-dependencies]
sha2 = "0.11"

[lints]
workspace = true
