[package]
name = "traverse-cli-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for Traverse — register, list, validate, and run governed capabilities"
include = ["src/**", "templates/**", "proto/**", "build.rs", "Cargo.toml"]

[[bin]]
name = "traverse-cli"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
ed25519-dalek = "3.0.0"
qrcode = { version = "0.14.1", default-features = false }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
wasm-encoder = "0.259"
wasmparser = "0.259"
traverse-contracts = { workspace = true }
traverse-registry = { workspace = true }
traverse-runtime = { workspace = true }
traverse-mcp = { workspace = true }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "tls-ring", "codegen", "router"] }
prost = "0.14.4"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = "0.1.19"
tonic-prost = "0.14.6"

[dev-dependencies]
wat = "1"

[lints]
workspace = true

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
